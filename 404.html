<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scene Not Found (404) — 9CineJoy</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="The scene or page you are looking for does not exist on 9CineJoy.">
  <meta name="theme-color" content="#070913">
  
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=14.0">
  <link rel="icon" type="image/svg+xml" href="icons/cinejoy-icon.svg?v=14.0">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --primary: #ff2a6d;
      --primary-hover: #ff4785;
      --bg: #070913;
      --surface: rgba(18, 24, 40, 0.72);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f9fafb;
      --text2: rgba(249, 250, 251, 0.72);
      --text3: rgba(249, 250, 251, 0.44);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(900px 500px at 15% 15%, rgba(59, 130, 246, 0.14), transparent 60%),
        radial-gradient(1000px 600px at 85% 25%, rgba(139, 92, 246, 0.12), transparent 60%),
        radial-gradient(800px 500px at 50% 85%, rgba(255, 42, 109, 0.08), transparent 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .not-found-card {
      width: 100%;
      max-width: 580px;
      background: var(--surface);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 0 24px rgba(255, 42, 109, 0.12);
      position: relative;
      overflow: hidden;
    }
    .not-found-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), #8b5cf6, transparent);
    }
    .brand-header {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
      color: var(--text);
    }
    .brand-header svg {
      filter: drop-shadow(0 2px 8px rgba(255, 42, 109, 0.4));
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-nine {
      color: var(--primary);
    }
    .brand-accent {
      color: var(--primary);
    }
    .hero-404 {
      font-size: clamp(72px, 16vw, 110px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 45%, rgba(255, 42, 109, 0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
      user-select: none;
    }
    .clapperboard-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(255, 42, 109, 0.12);
      border: 1px solid rgba(255, 42, 109, 0.28);
      margin-bottom: 20px;
      color: var(--primary);
    }
    h1 {
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text2);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      width: 100%;
    }
    .search-input {
      flex: 1;
      height: 44px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 16px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 42, 109, 0.2);
    }
    .search-btn {
      height: 44px;
      padding: 0 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .search-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .search-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #7928ca 100%);
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 16px rgba(255, 42, 109, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--primary-hover) 0%, #9333ea 100%);
      box-shadow: 0 6px 20px rgba(255, 42, 109, 0.45);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
    }
    @media (max-width: 480px) {
      .not-found-card {
        padding: 36px 20px;
      }
      .actions {
        flex-direction: column;
        width: 100%;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <main class="not-found-card" role="main">
    <a href="./#/" class="brand-header" title="Go to 9CineJoy Home">
      <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true">
        <defs>
          <linearGradient id="nfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff3b65"/>
            <stop offset="60%" stop-color="#e50914"/>
            <stop offset="100%" stop-color="#990011"/>
          </linearGradient>
        </defs>
        <path d="M32 8 C18.7 8 8 18.7 8 32 C8 45.3 18.7 56 32 56 C43.2 56 52.4 48.3 55.1 37.8 C55.8 35.3 53.9 33 51.4 33 C49.5 33 47.8 34.4 47.3 36.3 C45.2 43.6 39.1 48.8 32 48.8 C22.7 48.8 15.2 41.3 15.2 32 C15.2 22.7 22.7 15.2 32 15.2 C39.1 15.2 45.2 20.4 47.3 27.7 C47.8 29.6 49.5 31 51.4 31 C53.9 31 55.8 28.7 55.1 26.2 C52.4 15.7 43.2 8 32 8 Z" fill="url(#nfGrad)"/>
        <path d="M28 22.5 C28 21.6 29 21 29.8 21.5 L42.8 29 C43.5 29.4 43.5 30.6 42.8 31 L29.8 38.5 C29 39 28 38.4 28 37.5 Z" fill="#ffffff"/>
      </svg>
      <span class="brand-title"><span class="brand-nine">9</span>Cine<span class="brand-accent">Joy</span></span>
    </a>

    <div class="clapperboard-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.2 6 3 11l-.9-2.4 17.2-5z"/>
        <path d="m6.2 5.3 3.1 4.4"/>
        <path d="m11.6 3.7 3.1 4.4"/>
        <path d="m17 2.1 3.1 4.4"/>
        <path d="M4 11v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9Z"/>
      </svg>
    </div>

    <div class="hero-404" aria-label="404">404</div>
    <h1>This scene doesn't exist.</h1>
    <p>The page you're looking for may have moved or the link may be incorrect.</p>

    <form class="search-box" role="search" onsubmit="event.preventDefault(); const q = document.getElementById('nf-search-input').value.trim(); if(q) window.location.href='./#/search?q=' + encodeURIComponent(q);">
      <input type="text" id="nf-search-input" class="search-input" placeholder="Search movies, series or anime..." aria-label="Search titles">
      <button type="submit" class="search-btn">Search</button>
    </form>

    <div class="actions">
      <a href="./#/" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Back to Home
      </a>
      <button type="button" class="btn btn-secondary" onclick="if(history.length > 1) { history.back(); } else { window.location.href='./#/'; }">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Go Back
      </button>
    </div>
  </main>

</body>
</html>

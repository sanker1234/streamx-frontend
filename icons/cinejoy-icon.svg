<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Midnight Gradient -->
    <linearGradient id="cjBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121520"/>
      <stop offset="50%" stop-color="#0a0c13"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>

    <!-- Subtle Ambient Emerald Glow (cinejoy.pk style) -->
    <radialGradient id="cjAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#cjBgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Subtle Ambient Glow behind mascot -->
  <circle cx="256" cy="256" r="180" fill="url(#cjAura)"/>

  <!-- CineJoy Iconic Clapperboard Ticket Mascot -->
  <g transform="translate(256, 256) scale(3.8) translate(-50, -50)">
    <!-- White Ticket Body with Side Notches -->
    <path d="M22 16 C16 16 12 20 12 26 L12 42 C16 42 19 45 19 50 C19 55 16 58 12 58 L12 74 C12 80 16 84 22 84 L78 84 C84 84 88 80 88 74 L88 58 C84 58 81 55 81 50 C81 45 84 42 88 42 L88 26 C88 20 84 16 78 16 Z" fill="#ffffff"/>
    
    <!-- Clapper Stripes on Top Bar -->
    <path d="M26 16 L36 30 M46 16 L56 30 M66 16 L76 30" stroke="#0a0c13" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Clapper Divider Line -->
    <line x1="16" y1="30" x2="84" y2="30" stroke="#0a0c13" stroke-width="3"/>
    
    <!-- Left Eye: Play Button Triangle -->
    <polygon points="36,44 36,58 48,51" fill="#0a0c13"/>
    
    <!-- Right Eye: Playful Wink Arc -->
    <path d="M58 52 Q66 42 74 52" stroke="#0a0c13" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    
    <!-- Happy Smile Arc -->
    <path d="M42 66 Q55 76 68 66" stroke="#0a0c13" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>

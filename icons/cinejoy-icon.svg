<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="nineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff2a6d"/>
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Obsidian Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Living Neon Aura Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#neonGlow)"/>

  <!-- 9CineJoy Unified Cinema Emblem -->
  <g>
    <!-- Stylized Modern "9" Glyph -->
    <path d="M 212 216 
             C 202 236, 182 250, 156 250 
             C 124 250, 100 224, 100 192 
             C 100 160, 124 134, 156 134 
             C 188 134, 212 160, 212 192 
             C 212 268, 172 346, 114 372"
          fill="none"
          stroke="url(#nineGrad)"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Joyful Cinema Play Prism -->
    <path d="M 252 168 C 252 152, 270 142, 284 151 L 384 227 C 398 238, 398 258, 384 269 L 284 345 C 270 354, 252 344, 252 328 Z"
          fill="url(#prismGrad)"/>

    <!-- Joy Cinema Accent Smile Arc -->
    <path d="M 126 398 C 196 454, 314 444, 382 376"
          fill="none"
          stroke="#00f2fe"
          stroke-width="18"
          stroke-linecap="round"/>

    <!-- Luminous Spark Dot -->
    <circle cx="406" cy="170" r="15" fill="#ff2a6d"/>
  </g>
</svg>

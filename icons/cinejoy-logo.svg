<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" width="360" height="84">
  <defs>
    <linearGradient id="cjLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b65"/>
      <stop offset="60%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#990011"/>
    </linearGradient>

    <linearGradient id="logoNineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b65"/>
      <stop offset="100%" stop-color="#e50914"/>
    </linearGradient>

    <linearGradient id="joyTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b65"/>
      <stop offset="100%" stop-color="#e50914"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- 9 Badge -->
    <rect x="0" y="8" width="28" height="28" rx="8" fill="url(#logoNineGrad)"/>
    <text x="14" y="29" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif"
          font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">9</text>

    <!-- CineJoy Ribbon Icon -->
    <g transform="translate(36, -2) scale(1.05)">
      <path d="M32 8 C18.7 8 8 18.7 8 32 C8 45.3 18.7 56 32 56 C43.2 56 52.4 48.3 55.1 37.8 C55.8 35.3 53.9 33 51.4 33 C49.5 33 47.8 34.4 47.3 36.3 C45.2 43.6 39.1 48.8 32 48.8 C22.7 48.8 15.2 41.3 15.2 32 C15.2 22.7 22.7 15.2 32 15.2 C39.1 15.2 45.2 20.4 47.3 27.7 C47.8 29.6 49.5 31 51.4 31 C53.9 31 55.8 28.7 55.1 26.2 C52.4 15.7 43.2 8 32 8 Z"
            fill="url(#cjLogoGrad)"
            filter="url(#logoGlow)"/>
      <path d="M28 22.5 C28 21.6 29 21 29.8 21.5 L42.8 29 C43.5 29.4 43.5 30.6 42.8 31 L29.8 38.5 C29 39 28 38.4 28 37.5 Z"
            fill="#ffffff"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="120" y="54" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.8">
    <tspan fill="#ffffff">Cine</tspan><tspan fill="url(#joyTextGrad)">Joy</tspan>
  </text>
</svg>

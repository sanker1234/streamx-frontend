<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mobile viewport QA harness</title>
<style>
  body { margin: 0; background: #0b0d12; display: flex; gap: 12px; }
  .device { border: 1px solid #333; border-radius: 24px; overflow: hidden; box-shadow: 0 0 24px rgba(0,0,0,.6); }
  iframe { border: 0; display: block; background: #000; }
  #log { color: #9f9; font-family: monospace; font-size: 11px; white-space: pre-wrap; max-width: 420px; padding: 8px; }
</style>
</head>
<body>
<!-- iPhone-class and small-Android-class viewports; media queries respond to the iframe's own viewport -->
<div class="device"><iframe id="f390" style="width:390px;height:844px"></iframe></div>
<div class="device"><iframe id="f360" style="width:360px;height:740px"></iframe></div>
<pre id="log"></pre>
<script>
  const params = new URLSearchParams(location.hash.slice(1));
  const target = params.get("url") || "http://127.0.0.1:8417/";
  document.getElementById("f390").src = target;
  document.getElementById("f360").src = target;
  window.__frame = () => document.getElementById("f390").contentWindow;
  window.__frameSmall = () => document.getElementById("f360").contentWindow;
</script>
</body>
</html>

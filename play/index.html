<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineJoy — Streaming Playback</title>
  <script>
    // Seamlessly transfer clean query parameters to main application
    const search = window.location.search || "";
    if (search) {
      sessionStorage.setItem("cinejoy_pending_play", search);
    }
    window.location.replace("/#/play" + search);
  </script>
</head>
<body style="background:#050505;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <div style="text-align:center;">
    <div style="width:30px;height:30px;border:3px solid rgba(255,255,255,0.15);border-top-color:#ffffff;border-radius:50%;animation:cineSpin 0.6s linear infinite;margin:0 auto 14px;"></div>
    <span style="font-size:14px;letter-spacing:0.04em;color:rgba(255,255,255,0.75);">Launching CineJoy player…</span>
  </div>
  <style>
    @keyframes cineSpin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
